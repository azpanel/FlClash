name: Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yaml'
      - 'tool/android_release.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Android ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version: ['0.9.0', '0.9.2']
    steps:
      - name: Checkout build tools
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout original version
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ matrix.version }}
          path: source
          submodules: recursive
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: false

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Prepare application ID and signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 tool/android_release.py prepare source '${{ matrix.version }}'

      - name: Install dependencies
        working-directory: source
        run: flutter pub get

      - name: Build Android APKs
        working-directory: source
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: flutter build apk --release --split-per-abi --dart-define=APP_ENV=stable

      - name: Verify and name APKs
        run: python3 tool/android_release.py collect source '${{ matrix.version }}'

      - name: Publish Android APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.version }}
          name: FlClash ${{ matrix.version }} Android
          files: dist/FlClash-${{ matrix.version }}-android-*.apk
          fail_on_unmatched_files: true
          body: |
            Android APKs based on the original v${{ matrix.version }} tag.
            Application ID: `com.lumenlink.client`.
            Architectures: arm64-v8a, armeabi-v7a and x86_64.
          make_latest: ${{ matrix.version == '0.9.2' && 'true' || 'false' }}
